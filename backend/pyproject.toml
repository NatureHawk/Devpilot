[project]
name = "devpilot-backend"
version = "0.1.0"
description = "DevPilot API — repository-grounded engineering assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # GitHub client, token encryption, and signed session/state values.
    "httpx>=0.28",
    "cryptography>=44",
    "itsdangerous>=2.2",
    # Syntax-aware parsing. Each grammar is a separate package; only languages
    # with a grammar here are ever reported as parseable.
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
# Alembic's generated env/versions are script-style and not worth strict typing.
exclude = "^alembic/"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a reachable PostgreSQL instance (DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning"]
